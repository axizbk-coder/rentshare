# This file belongs at the root of the generated iOS repository.
# Both workflows are started manually. Neither uploads or submits to Apple.
workflows:
  ios-simulator:
    name: RentShare - unsigned iOS validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.6"
    scripts:
      - name: Validate Xcode project and privacy resources
        script: bash ci/preflight.sh
      - name: Build Release for iOS Simulator
        script: |
          set -euo pipefail
          mkdir -p build/logs
          xcodebuild -project RentShare.xcodeproj -scheme RentShare \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/simulator.log
          test -f build/DerivedData/Build/Products/Release-iphonesimulator/RentShare.app/PrivacyInfo.xcprivacy
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release-iphonesimulator/RentShare.app build/RentShare-Simulator.zip
    artifacts:
      - build/RentShare-Simulator.zip
      - build/logs/*.log
  ios-distribution:
    name: RentShare - signed App Store IPA (no upload)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "26.6"
      # Upload matching distribution certificate + profile to Codemagic first.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.rentshare.ios
    scripts:
      - name: Validate source and explicit release build number
        script: |
          set -euo pipefail
          bash ci/preflight.sh
          bash ci/set-build-number.sh
      - name: Apply securely stored signing identities
        script: xcode-project use-profiles
      - name: Archive and export signed IPA
        script: |
          xcode-project build-ipa --project RentShare.xcodeproj --scheme RentShare
      - name: Verify exported distribution package
        script: python3 ci/verify-ipa.py
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
